name: Android APK Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Validate backend
        run: |
          npm --prefix backend run prisma:generate
          npm --prefix backend run build
          npm --prefix backend test

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate release configuration
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          set -euo pipefail
          [[ "$API_BASE_URL" == https://* ]] || { echo "::error::Set API_BASE_URL to the production HTTPS API URL."; exit 1; }
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || { echo "::error::Set the ANDROID_KEYSTORE_BASE64 secret."; exit 1; }
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || { echo "::error::Set the ANDROID_KEYSTORE_PASSWORD secret."; exit 1; }
          [[ -n "$ANDROID_KEY_ALIAS" ]] || { echo "::error::Set the ANDROID_KEY_ALIAS secret."; exit 1; }
          [[ -n "$ANDROID_KEY_PASSWORD" ]] || { echo "::error::Set the ANDROID_KEY_PASSWORD secret."; exit 1; }
          [[ -n "$MAPS_API_KEY" ]] || { echo "::error::Set a restricted Android MAPS_API_KEY secret."; exit 1; }

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Check Flutter code and tests
        run: |
          flutter analyze
          flutter test

      - name: Build signed APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          LOCAL_API_BASE_URL: ${{ vars.LOCAL_API_BASE_URL }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          LOCAL_API_BASE_URL="${LOCAL_API_BASE_URL:-http://10.0.2.2:4000/api/v1}"
          flutter build apk --release \
            --build-name="$VERSION" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=LOCAL_API_BASE_URL="$LOCAL_API_BASE_URL" \
            --dart-define=GOOGLE_MAPS_CONFIGURED=true

      - name: Name release APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "build/app/outputs/flutter-apk/Ram-Prasad-General-Store-${VERSION}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/app/outputs/flutter-apk/Ram-Prasad-General-Store-${GITHUB_REF_NAME#v}.apk" \
            --title "Ram Prasad General Store ${GITHUB_REF_NAME#v}" \
            --generate-notes
