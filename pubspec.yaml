name: freshharvest_grocery
description: "A production-grade grocery shopping & delivery mobile application built with Flutter & Material 3."
publish_to: 'none'
version: 2.0.10+12

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Architecture
  provider: ^6.1.1
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Networking & API
  http: ^1.2.0
  dio: ^5.4.0

  # Storage & Caching
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  cached_network_image_platform_interface: ^4.1.1

  # UI, Icons, Typography
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  intl: ^0.20.3
  flutter_svg: ^2.0.9

  # Utilities & UUID
  uuid: ^4.3.3
  file_picker: ^13.1.0
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.0.1
  geocoding: ^5.0.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  google_maps_flutter: ^2.18.2
  url_launcher: ^6.3.3
  dotlottie_flutter: ^0.1.7
  video_player: ^2.14.1
  pdf: ^3.13.1
  printing: ^5.15.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/home_diya.webp
    - assets/images/diwali_popup_sale_banner.png
    - assets/icons/
    - assets/animations/
    - assets/onboarding/
    - assets/videos/dia.mp4

flutter_icons:
  android: true
  ios: false
  image_path: "assets/icons/faststore-icon.png"
  adaptive_icon_background: "#16A34A"
  adaptive_icon_foreground: "assets/icons/faststore-icon.png"
